name: Build MLCA 2.1.2 PC Builder

on:
  push:
    branches:
      - mlca-pc-builder-2.1.2
    paths:
      - "tools/make_mlca_pc_builder_212.py"
      - ".github/workflows/build-mlca-pc-builder-212.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Download exact MLCA 2.1.2 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MLCA-2.1.2-APK
          path: _apk_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36661885778

      - name: Generate PC Builder from APK 2.1.2
        shell: pwsh
        run: |
          python -m pip install "Pillow>=10.4.0"
          python tools/make_mlca_pc_builder_212.py --repo-root . --apk-artifact-dir _apk_artifact --output-dir _pc
          $builder = Get-ChildItem _pc -Directory | Where-Object { $_.Name -like "MobileLegendsCounterAssistant_v2.1.2_PC_Builder_Free" } | Select-Object -First 1
          if (-not $builder) { throw "Builder directory not generated" }
          New-Item -ItemType Directory -Force -Path _deliverables | Out-Null
          Compress-Archive -Path $builder.FullName -DestinationPath "_deliverables/MobileLegendsCounterAssistant_v2.1.2_PC_Builder_Free.zip" -CompressionLevel Optimal
          Get-FileHash "_deliverables/MobileLegendsCounterAssistant_v2.1.2_PC_Builder_Free.zip" -Algorithm SHA256

      - name: Build EXE using the generated Builder
        shell: pwsh
        run: |
          $builder = Get-ChildItem _pc -Directory | Where-Object { $_.Name -eq "MobileLegendsCounterAssistant_v2.1.2_PC_Builder_Free" } | Select-Object -First 1
          Push-Location $builder.FullName
          cmd /c build_exe.bat
          $code = $LASTEXITCODE
          if (Test-Path build.log) {
            Get-Content build.log -Tail 250
          }
          if ($code -ne 0) { throw "build_exe.bat failed with exit code $code" }

          $portable = Get-ChildItem -Path dist -Recurse -Filter "MobileLegendsCounterAssistant-2.1.2-portable-free.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $portable) { throw "Verified portable ZIP was not produced" }

          Copy-Item $portable.FullName (Join-Path $env:GITHUB_WORKSPACE "_deliverables/MLCA-2.1.2-PC-Portable.zip") -Force
          Get-FileHash (Join-Path $env:GITHUB_WORKSPACE "_deliverables/MLCA-2.1.2-PC-Portable.zip") -Algorithm SHA256
          Pop-Location

      - name: Upload Builder
        uses: actions/upload-artifact@v4
        with:
          name: MLCA-2.1.2-PC-Builder-Free
          path: _deliverables/MobileLegendsCounterAssistant_v2.1.2_PC_Builder_Free.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified PC Portable
        uses: actions/upload-artifact@v4
        with:
          name: MLCA-2.1.2-PC-Portable
          path: _deliverables/MLCA-2.1.2-PC-Portable.zip
          if-no-files-found: error
          retention-days: 14
