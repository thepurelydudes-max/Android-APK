name: Validate Wild Rift 3.7.13 cleanup

on:
  push:
    branches:
      - release-3.7.13-cleanup
    paths:
      - "wild_rift/**"
      - ".github/workflows/validate-3.7.13-cleanup.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0" "vulture==2.14"
      - name: Download canonical 3.7.12 APK seed
        uses: actions/download-artifact@v4
        with:
          name: FARLINER-Wild-Rift-APK
          path: ${{ runner.temp }}/base_apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36425019210
      - name: Restore exact updated database/cache
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ runner.temp }}/base_apk" -type f -name '*.apk' -print -quit)"
          unzip -p "$APK" assets/app.zip > "${{ runner.temp }}/app.zip"
          rm -rf wild_rift/assets/cache wild_rift/assets/data "${{ runner.temp }}/app"
          mkdir -p "${{ runner.temp }}/app"
          unzip -q "${{ runner.temp }}/app.zip" 'assets/cache/*' 'assets/data/*' -d "${{ runner.temp }}/app"
          cp -a "${{ runner.temp }}/app/assets/cache" wild_rift/assets/
          cp -a "${{ runner.temp }}/app/assets/data" wild_rift/assets/
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,sqlite3
          root=Path("wild_rift")
          sql=lzma.decompress(base64.b64decode((root/"preseed"/"pc_updated_3_7_12.sql.xz.b64").read_text())).decode()
          con=sqlite3.connect(root/"assets"/"data"/"wildrift.db")
          con.executescript(sql); con.commit()
          assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          assert con.execute("SELECT COUNT(*) FROM champions").fetchone()[0]==142
          assert con.execute("SELECT COUNT(*) FROM role_builds").fetchone()[0]==226
          con.close()
          PY
      - name: Compile and regression tests
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          cd wild_rift
          test "$(cat VERSION.txt)" = "3.7.13"
          python -m compileall -q .
          python -m unittest -v test_regressions.py
          if grep -R "_fallback_pool_build" -n engine.py; then
            echo "::error::Legacy fallback function still exists"
            exit 1
          fi
      - name: Differential recommendation equivalence
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          git show 6838cbb18899bb4b397864df16d5a7d06ed47ca2:wild_rift/engine.py > wild_rift/engine_3712_baseline.py
          cd wild_rift
          python - <<'PY'
          import math, random
          import db
          import engine as new
          import engine_3712_baseline as old
          from paths import ensure_initial_data

          ensure_initial_data(); db.init_db()
          s=db.load_runtime_snapshot()
          rng=random.Random(3713)
          roles=list(new.CANONICAL_ROLES)

          def legal(c,r): return new.lane_ok(c,r)
          def full_draft(exclude=frozenset()):
              used=set(exclude); out=[]
              for role in roles:
                  pool=[c for c in s["champions"] if c.get("id") not in used and legal(c,role)]
                  c=rng.choice(pool); out.append((c["id"],role)); used.add(c["id"])
              return out

          supported=[]
          for c in s["champions"]:
              for role in roles:
                  if legal(c,role) and new._has_usable_role_build(c,role,s):
                      supported.append((c["id"],role))

          pick_cases=0
          for _ in range(300):
              enemies=full_draft()
              for role in roles:
                  a=old.recommend_picks(role,enemies,limit=500,snapshot=s)
                  a=[r for r in a if new._has_usable_role_build(r["champion"],role,s)]
                  b=new.recommend_picks(role,enemies,limit=500,snapshot=s)
                  assert [r["champion"]["id"] for r in a]==[r["champion"]["id"] for r in b]
                  for x,y in zip(a,b):
                      for key in ("score","matchup_score","coverage_score","tier_score","winrate_score","win_rate"):
                          xv,yv=x.get(key),y.get(key)
                          if xv is None or yv is None:
                              assert xv is yv
                          else:
                              assert math.isclose(float(xv),float(yv),rel_tol=0,abs_tol=1e-12)
                  pick_cases+=1

          build_cases=0
          keys=(
              "role","base","situational","ordered","source","source_url",
              "source_missing","selected_variant","selected_variant_core_available",
              "selected_variant_trigger","selected_variant_example_enemies",
              "selected_variant_example_text","exact_opponent_adaptations",
              "threat_counts","draft_features",
          )
          for cid,role in supported:
              for _ in range(12):
                  enemies=full_draft({cid})
                  a=old.recommend_build(cid,enemies,role_ru=role,snapshot=s)
                  b=new.recommend_build(cid,enemies,role_ru=role,snapshot=s)
                  for key in keys:
                      assert a.get(key)==b.get(key), (cid,role,key,a.get(key),b.get(key))
                  build_cases+=1

          print("PICK_EQUIVALENCE_CASES",pick_cases)
          print("BUILD_EQUIVALENCE_CASES",build_cases)
          print("RECOMMENDATION_EQUIVALENCE_OK")
          PY
          rm -f engine_3712_baseline.py
      - name: Dead-code audit
        shell: bash
        run: |
          set -euo pipefail
          echo "Vulture 100% confidence findings:"
          vulture wild_rift --min-confidence 100 || true
