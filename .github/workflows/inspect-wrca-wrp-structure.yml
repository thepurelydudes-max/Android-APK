name: Inspect WR Pocket recommendation markup
on:
  push:
    branches: [main]
    paths: [".inspect-wrca-wrp-trigger"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          for champ in ('yasuo','hwei','senna'):
              soup=BeautifulSoup(requests.get('https://wrpocket.app/en/champions/'+champ,timeout=20).text,'html.parser')
              print('===',champ,'===')
              raw=str(soup)
              print("MULTI_ROLE_PROBE",champ,"rune_h3",len([t for t in soup.find_all("h3") if "Runes" in t.get_text(' ',strip=True)]),"role_markers",[(m,raw.count(m)) for m in ['data-cnb-lane','data-cnb-role','data-cnb-champ','data-lane','cnb_by_lane','data-rank']],"all-links",len(soup.find_all("a",href=lambda h: h and h.startswith("/en/champions/"))))
              for node in soup.find_all(attrs={'data-cnb-lane':True}): print('LANE_MARKUP',champ,node.name,node.get('data-cnb-lane'),str(node)[:600])
              for node in soup.select('script'):
                  txt=node.get_text()
                  if 'cnb' in txt.lower() or 'lane' in txt.lower(): print('SCRIPT_SAMPLE',champ,len(txt),txt[:400])
              for node in soup.find_all('script'):
                  st=node.get_text()
                  if len(st)>10000:
                      print('SCRIPT_FLAGS',champ,'length',len(st),'fetches',[(i,st[max(0,i-45):i+130]) for i in [m.start() for m in __import__('re').finditer(r'fetch|/api/|cnbData|trendData|runeCombo|cnb-lane',st,__import__('re').I)][:14]])
              for query in ['?lane=top','?lane=support']:
                  rr=requests.get('https://wrpocket.app/en/champions/'+champ+query,timeout=20)
                  ss=BeautifulSoup(rr.text,'html.parser')
                  h=ss.find('h3',string=lambda text: bool(text and 'Runes' in text))
                  print('ROLE_QUERY',champ,query,rr.status_code, 'selected',[(b.get('data-cnb-lane'),b.get('aria-pressed')) for b in ss.select('button[data-cnb-lane]')], 'rune_row',[(b.get('data-name-en')) for b in (h.parent.select('ol li.wrp-cnb-row')[1].select('button[data-name-en]') if h and h.parent.select('ol li.wrp-cnb-row') and len(h.parent.select('ol li.wrp-cnb-row'))>1 else [])])
              for tag in soup.find_all(['h2','h3','h4']):
                  if 'Build Trends' in tag.get_text(' ',strip=True) or tag.get_text(' ',strip=True).startswith(('Runes','Core items')):
                      print('HEADING',tag.name,tag.get_text(' ',strip=True),'PARENT',tag.parent.name,tag.parent.get('class'))
                      print('NEXT_SIBLINGS',[(x.name,x.get('class'),x.get_text(' ',strip=True)[:155]) for x in tag.next_siblings if getattr(x,'name',None)][:8])
                      print('PARENT_HTML',str(tag.parent)[:4500])
                      print('NEXT',str(tag.find_next('table'))[:3200] if tag.find_next('table') else 'NONE')
          PY
