name: Inspect WR Pocket recommendation markup
on:
  push:
    branches: [main]
    paths: [".inspect-wrca-wrp-trigger"]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests beautifulsoup4
      - shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          for champ in ('yasuo','hwei','senna'):
              soup=BeautifulSoup(requests.get('https://wrpocket.app/en/champions/'+champ,timeout=20).text,'html.parser')
              print('===',champ,'===')
              raw=str(soup)
              print("MULTI_ROLE_PROBE",champ,"rune_h3",len([t for t in soup.find_all("h3") if "Runes" in t.get_text(' ',strip=True)]),"role_markers",[(m,raw.count(m)) for m in ['data-cnb-lane','data-cnb-role','data-cnb-champ','data-lane','cnb_by_lane','data-rank']],"all-links",len(soup.find_all("a",href=lambda h: h and h.startswith("/en/champions/"))))
              for tag in soup.find_all(['h2','h3','h4']):
                  if 'Build Trends' in tag.get_text(' ',strip=True) or tag.get_text(' ',strip=True).startswith(('Runes','Core items')):
                      print('HEADING',tag.name,tag.get_text(' ',strip=True),'PARENT',tag.parent.name,tag.parent.get('class'))
                      print('NEXT_SIBLINGS',[(x.name,x.get('class'),x.get_text(' ',strip=True)[:155]) for x in tag.next_siblings if getattr(x,'name',None)][:8])
                      print('PARENT_HTML',str(tag.parent)[:4500])
                      print('NEXT',str(tag.find_next('table'))[:3200] if tag.find_next('table') else 'NONE')
          PY
