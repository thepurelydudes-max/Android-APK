name: Diagnose MLBB Sources

on:
  push:
    paths:
      - ".github/workflows/diagnose-mlbb-sources.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install requests Pillow beautifulsoup4

      - name: Run real MLBB updater
        env:
          FLET_ASSETS_DIR: ${{ github.workspace }}/mlbb/assets
          FLET_APP_STORAGE_DATA: /tmp/mlbb_runtime
        working-directory: mlbb
        run: |
          python - <<'PY'
          import json
          import paths
          paths.ensure_initial_data()
          import updater
          summary = updater.update_all(lambda msg: print("PROGRESS:", msg))
          print("=== UPDATE SUMMARY ===")
          print(json.dumps(summary, ensure_ascii=False, indent=2, default=str))
          print("=== ERRORS ===")
          for i, err in enumerate(summary.get("errors") or [], 1):
              print(f"{i}. {err}")
          PY

      - name: Probe live counter endpoint direction and coverage
        continue-on-error: true
        working-directory: mlbb
        run: |
          python - <<'PY'
          import json, requests
          from sources import RONE_HERO_COUNTERS, RONE_PUBLIC_HEROES, fetch_mlbb_patch_info, Net
          print("PATCH", fetch_mlbb_patch_info(Net(delay=0)))
          heroes = requests.get(f"{RONE_PUBLIC_HEROES}?size=300&index=1&lang=en", timeout=30).json()
          records = ((heroes.get("data") or {}).get("records") or [])
          ids = []
          for rec in records:
              row=(rec or {}).get("data") or {}
              hid=row.get("hero_id") or row.get("heroid")
              name=(((row.get("hero") or {}).get("data") or {}).get("name") or "")
              ids.append((str(hid),name))
          print("PUBLIC HERO RECORDS", len(records), "UNIQUE IDS", len({x[0] for x in ids}), "FIRST", ids[:5], "LAST", ids[-5:])
          for hid in ("103","8","19","20","130","97"):
              url=RONE_HERO_COUNTERS.format(hero_id=hid)+"?days=7&rank=all&size=300&index=1&lang=en"
              payload=requests.get(url,timeout=30).json()
              rows=((payload.get("data") or {}).get("records") or [])
              print("COUNTER",hid,"records",len(rows))
              for rec in rows[:2]:
                  data=(rec or {}).get("data") or {}
                  a=data.get("sub_hero") or []
                  b=data.get("sub_hero_last") or []
                  print(" main",data.get("main_heroid"),"plus",len(a),"minus",len(b),
                        "plus_sample",[(x.get("heroid"),x.get("increase_win_rate")) for x in a[:5]],
                        "minus_sample",[(x.get("heroid"),x.get("increase_win_rate")) for x in b[:5]])
          PY

      - name: Probe direct Moonton GMS and Academy fallback
        if: always()
        working-directory: mlbb
        run: |
          python - <<'PY'
          import requests
          from moonton_gms import MOONTON_GMS_SOURCE_URL, parse_gms_source
          from sources import RONE_ACADEMY_HERO_COUNTERS
          try:
              gms_body = {
                  "pageSize": 500,
                  "pageIndex": 1,
                  "filters": [
                      {"field": "bigrank", "operator": "eq", "value": "8"},
                      {"field": "match_type", "operator": "eq", "value": 0},
                  ],
                  "sorts": [
                      {"data": {"field": "main_hero_win_rate", "order": "desc"}, "type": "sequence"},
                      {"data": {"field": "main_heroid", "order": "desc"}, "type": "sequence"},
                  ],
                  "fields": [
                      "main_hero","main_hero_appearance_rate","main_hero_ban_rate",
                      "main_hero_channel","main_hero_win_rate","main_heroid",
                      "sub_hero","sub_hero_last",
                  ],
              }
              gms_headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json",
                  "Content-Type": "application/json;charset=UTF-8",
                  "X-AppId": "2669606",
                  "X-ActId": "2669607",
                  "X-Lang": "en",
              }
              response=requests.post(MOONTON_GMS_SOURCE_URL, json=gms_body, headers=gms_headers, timeout=30)
              print("GMS STATUS", response.status_code, "LEN", len(response.content))
              response.raise_for_status()
              print("GMS CODE", response.json().get("code"), response.json().get("message"))
              parsed=parse_gms_source(response.json(), rank_segment="all")
              print("GMS TOTAL", parsed.get("total"), "HEROES", len(parsed.get("heroes") or []), "MATCHUPS", len(parsed.get("matchups") or []))
              by={(x.champion_id,x.enemy_id):x.raw_edge for x in parsed.get("matchups") or []}
              for pair in [("103","8"),("20","97"),("130","97")]:
                  print("GMS EDGE", pair, by.get(pair))
          except Exception as exc:
              print("GMS ERROR", repr(exc))
          for hid in ("103","20","130"):
              try:
                  url=RONE_ACADEMY_HERO_COUNTERS.format(hero_id=hid)+"?rank=all&size=300&index=1&lang=en"
                  response=requests.get(url, timeout=30)
                  print("ACADEMY STATUS", hid, response.status_code, "LEN", len(response.content))
                  response.raise_for_status()
                  rows=((response.json().get("data") or {}).get("records") or [])
                  print("ACADEMY RECORDS",hid,len(rows))
                  for rec in rows[:1]:
                      data=(rec or {}).get("data") or {}
                      print("ACADEMY MAIN",data.get("main_heroid"),
                            "SUB",[(x.get("heroid"),x.get("increase_win_rate")) for x in (data.get("sub_hero") or [])[:5]],
                            "LAST",[(x.get("heroid"),x.get("increase_win_rate")) for x in (data.get("sub_hero_last") or [])[:5]])
              except Exception as exc:
                  print("ACADEMY ERROR", hid, repr(exc))
          PY

      - name: Probe MLBBHub counter HTML
        working-directory: mlbb
        run: |
          python - <<'PY'
          import re, requests
          url="https://mlbbhub.com/counter/paquito"
          r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0"})
          print("MLBBHUB STATUS",r.status_code,"LEN",len(r.text),"CT",r.headers.get("content-type"))
          text=r.text
          for needle in ("Proven Counters","Esmeralda","Strong Against","Karina","__NEXT_DATA__","application/ld+json"):
              i=text.find(needle)
              print("\nNEEDLE",needle,"AT",i)
              if i>=0: print(text[max(0,i-800):i+2500])
          tokens=re.findall(r"([A-Za-z][A-Za-z .'-]{1,30}).{0,160}?([+-]?[0-9]+(?:\\.[0-9]+)?)pp", text, flags=re.I|re.S)
          print("EDGE TOKENS",tokens[:40])
          PY

# diagnostics-run-5-mlbbhub-html
