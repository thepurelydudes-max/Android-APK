name: Diagnose primary role gate

on:
  push:
    branches:
      - diagnose-primary-role-gate-20261001
    paths:
      - "wild_rift/diagnose_primary_role_gate.py"
      - ".github/workflows/diagnose-primary-role-gate.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
      - name: Download canonical WRCA seed
        uses: actions/download-artifact@v4
        with:
          name: FARLINER-Wild-Rift-APK
          path: ${{ runner.temp }}/base_apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36671624851
      - name: Restore bundled database/cache
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ runner.temp }}/base_apk" -type f -name '*.apk' -print -quit)"
          unzip -p "$APK" assets/app.zip > "${{ runner.temp }}/app.zip"
          rm -rf wild_rift/assets/cache wild_rift/assets/data "${{ runner.temp }}/app"
          mkdir -p "${{ runner.temp }}/app"
          unzip -q "${{ runner.temp }}/app.zip" 'assets/cache/*' 'assets/data/*' -d "${{ runner.temp }}/app"
          cp -a "${{ runner.temp }}/app/assets/cache" wild_rift/assets/
          cp -a "${{ runner.temp }}/app/assets/data" wild_rift/assets/
      - name: Run diagnostic
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          cd wild_rift
          python diagnose_primary_role_gate.py
