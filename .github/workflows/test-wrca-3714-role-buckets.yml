name: Test WRCA 3.7.14 role buckets

on:
  push:
    branches:
      - wrca-3.7.14-role-buckets-20261001
    paths:
      - "wild_rift/engine.py"
      - "wild_rift/draft_matrix_engine.py"
      - "wild_rift/test_regressions.py"
      - "wild_rift/VERSION.txt"
      - ".github/workflows/test-wrca-3714-role-buckets.yml"

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
      - name: Download canonical 3.7.13 seed
        uses: actions/download-artifact@v4
        with:
          name: FARLINER-Wild-Rift-APK
          path: ${{ runner.temp }}/base_apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36671624851
      - name: Restore exact bundled DB/cache
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ runner.temp }}/base_apk" -type f -name '*.apk' -print -quit)"
          unzip -p "$APK" assets/app.zip > "${{ runner.temp }}/app.zip"
          rm -rf wild_rift/assets/cache wild_rift/assets/data "${{ runner.temp }}/app"
          mkdir -p "${{ runner.temp }}/app"
          unzip -q "${{ runner.temp }}/app.zip" 'assets/cache/*' 'assets/data/*' -d "${{ runner.temp }}/app"
          cp -a "${{ runner.temp }}/app/assets/cache" wild_rift/assets/
          cp -a "${{ runner.temp }}/app/assets/data" wild_rift/assets/
      - name: Regression suite
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          cd wild_rift
          python -m py_compile db.py draft_matrix_engine.py engine.py sources.py updater.py main.py
          python -m unittest -v test_regressions.py
      - name: Real DB role-bucket invariant
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/audit_runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          cd wild_rift
          python - <<'PY'
          import db, engine
          from paths import ensure_initial_data

          ensure_initial_data(); db.init_db()
          s=db.load_runtime_snapshot()
          roles=list(engine.CANONICAL_ROLES)
          primary={}
          for c in s["champions"]:
              role=engine._primary_recommendation_role(c,s)
              if role:
                  primary[c["id"]]=role
                  assert engine._has_usable_role_build(c,role,s)

          print("PRIMARY_ROLE_COUNTS", {r:sum(1 for x in primary.values() if x==r) for r in roles})
          assert len(primary) >= 130

          enemies=[
              ("Irelia","Барон"), ("Hecarim","Лес"), ("Vex","Мид"),
              ("Kaisa","ADC"), ("Soraka","Саппорт"),
          ]
          seen={}
          for role in roles:
              rows=engine.recommend_picks(role,enemies,limit=500,snapshot=s)
              for row in rows:
                  cid=row["champion"]["id"]
                  assert primary.get(cid)==role, (cid,role,primary.get(cid))
                  assert cid not in seen, (cid,seen[cid],role)
                  seen[cid]=role
              print(role, "candidates", len(rows), "top10", [r["champion"]["id"] for r in rows[:10]])

          # Vayne must live in ADC, not Baron, on the current database.
          vayne=s["champions_by_id"]["Vayne"]
          print("VAYNE_PRIMARY", engine._primary_recommendation_role(vayne,s))
          assert engine._primary_recommendation_role(vayne,s)=="ADC"

          print("ROLE_BUCKET_INVARIANT_OK")
          PY
