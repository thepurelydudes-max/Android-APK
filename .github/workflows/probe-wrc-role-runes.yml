name: Probe WildRiftCore Role Runes

on:
  push:
    branches:
      - wrca-runes-3.9.3-test
    paths:
      - ".wrc-runes-probe-trigger"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect WRC role runes through production transport
        shell: bash
        run: |
          cd wild_rift
          python - <<'PY'
          import sources

          for champ in ("diana","malphite","syndra"):
              url=f"https://wildriftcore.com/en/champions/{champ}/builds/"
              net=sources.Net(timeout=30)
              text, transport=sources._wildriftcore_build_text(net,url,print)
              print("TRANSPORT",champ,transport,"LEN",len(text))
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  low=line.casefold()
                  if (
                      "recommended build" in low
                      or "recommended runes" in low
                      or "situational runes" in low
                      or line.strip().casefold()=="## runes"
                  ):
                      print("HIT",champ,i,repr(line))
                      for n,x in enumerate(lines[max(0,i-8):min(len(lines),i+35)],max(0,i-8)):
                          print("L",n,repr(x))
                      print("---")
          PY
