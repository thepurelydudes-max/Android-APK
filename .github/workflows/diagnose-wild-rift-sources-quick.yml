name: Diagnose Wild Rift Sources Quick

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".wr-sources-quick-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
      - run: |
          cd wild_rift
          python diagnose_wr_sources_quick.py
