name: Diagnose Wild Rift Updater

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".wr-updater-diagnostic-trigger"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
      - name: Run live updater against disposable runtime
        run: |
          cd wild_rift
          python diagnose_updater.py
