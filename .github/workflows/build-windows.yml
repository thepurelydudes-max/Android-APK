name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".build-pc-trigger"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[desktop,cli]==1.0.1" pyinstaller "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
          flet --version
          python --version

      - name: Restore current verified WRCA package
        shell: pwsh
        run: |
          $latest = Get-Content "wrca_data/latest.json" -Raw | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP "wrca-data.zip"
          Invoke-WebRequest -Uri $latest.download_url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $latest.sha256.ToLowerInvariant()) {
            throw "WRCA data package SHA-256 mismatch"
          }
          $extract = Join-Path $env:RUNNER_TEMP "wrca-data"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          if (!(Test-Path "$extract\data\wildrift.db")) { throw "wildrift.db missing in WRCA data package" }
          if (!(Test-Path "$extract\cache")) { throw "cache missing in WRCA data package" }
          if (Test-Path "wild_rift\assets\data") { Remove-Item "wild_rift\assets\data" -Recurse -Force }
          if (Test-Path "wild_rift\assets\cache") { Remove-Item "wild_rift\assets\cache" -Recurse -Force }
          Copy-Item "$extract\data" "wild_rift\assets\data" -Recurse
          Copy-Item "$extract\cache" "wild_rift\assets\cache" -Recurse
          @'
          import sqlite3
          from pathlib import Path
          db = Path("wild_rift/assets/data/wildrift.db")
          con = sqlite3.connect(db)
          meta = dict(con.execute("SELECT key,value FROM meta"))
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert meta.get("patch_version") == "7.3a", meta
          assert meta.get("package_version"), meta
          print("PC seed:", meta.get("patch_version"), meta.get("last_update"), meta.get("package_version"))
          con.close()
          '@ | python -

      - name: Test shared WRCA engine
        shell: pwsh
        working-directory: wild_rift
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}\wrca_pc_test
          FLET_ASSETS_DIR: ${{ github.workspace }}\wild_rift\assets
        run: |
          python -m py_compile db.py draft_matrix_engine.py engine.py sources.py updater.py package_updater.py item_text_utils.py main.py desktop_main.py adaptive_descriptions.py build_pc_release.py
          python -m unittest -v test_regressions.py

      - name: Create Windows icon
        shell: pwsh
        working-directory: wild_rift
        run: |
          python -c "from PIL import Image; im=Image.open('assets/icon.png').convert('RGBA'); im.save('assets/icon_windows.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build one-file EXE
        shell: pwsh
        working-directory: wild_rift
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          flet pack desktop_main.py --name WildRiftCounterAssistant --icon assets/icon_windows.ico --product-name "WR Counter Assistant" --file-description "Wild Rift Counter Assistant" --product-version $version --file-version "$version.0" --company-name "FARLINER" --yes
          if (!(Test-Path "dist\WildRiftCounterAssistant.exe")) {
            throw "Windows EXE was not created"
          }

      - name: Assemble portable package
        shell: pwsh
        working-directory: wild_rift
        run: |
          python build_pc_release.py
          Get-ChildItem -Recurse release | Select-Object FullName,Length

      - name: Assemble WRCA 3.9.2 PC Builder
        shell: pwsh
        run: |
          $version = (Get-Content "wild_rift\VERSION.txt" -Raw).Trim()
          $builderName = "WildRiftCounterAssistant_v" + $version + "_PC_Builder_Free"
          $builderRoot = "wild_rift\release\" + $builderName
          if (Test-Path $builderRoot) { Remove-Item $builderRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $builderRoot | Out-Null

          $files = @(
            "main.py",
            "desktop_main.py",
            "db.py",
            "engine.py",
            "draft_matrix_engine.py",
            "package_updater.py",
            "item_text_utils.py",
            "adaptive_descriptions.py",
            "media_cache.py",
            "paths.py",
            "localization.py",
            "sources.py",
            "updater.py",
            "test_regressions.py",
            "build_pc_release.py",
            "build_pc.bat",
            "run_pc.bat",
            "requirements.txt",
            "VERSION.txt",
            "README_PORTABLE_RU.md"
          )
          foreach ($name in $files) {
            Copy-Item ("wild_rift\" + $name) (Join-Path $builderRoot $name)
          }
          Copy-Item "wild_rift\assets" (Join-Path $builderRoot "assets") -Recurse

          $readme = @"
          # WRCA $version PC Builder Free

          Это исходный Windows-билдер WRCA $version. Он использует ту же логику
          рекомендаций и тот же GitHub package updater, что Android APK $version.

          Запуск из исходников: run_pc.bat
          Сборка portable EXE: build_pc.bat

          В assets/data и assets/cache уже вложен текущий проверенный WRCA Data Package.
          При последующих обновлениях сама программа скачивает один проверенный ZIP
          из GitHub Releases через wrca_data/latest.json.
          "@
          $readme | Set-Content (Join-Path $builderRoot "README_BUILDER_RU.md") -Encoding UTF8

          $builderZip = "wild_rift\release\" + $builderName + ".zip"
          if (Test-Path $builderZip) { Remove-Item $builderZip -Force }
          Compress-Archive -Path $builderRoot -DestinationPath $builderZip -CompressionLevel Optimal
          if (!(Test-Path $builderZip)) { throw "Builder ZIP was not created" }
          Get-Item $builderZip | Select-Object FullName,Length
      - name: Smoke-check portable package
        shell: pwsh
        working-directory: wild_rift
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $zip = "release\WildRiftCounterAssistant-$version-Portable-FREE.zip"
          if (!(Test-Path $zip)) { throw "Portable ZIP not found: $zip" }
          $manifest = Get-Content "release\WildRiftCounterAssistant\distribution.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "Manifest version mismatch" }
          if (!(Test-Path "release\WildRiftCounterAssistant\data\wildrift.db")) { throw "Database missing" }
          if (!(Test-Path "release\WildRiftCounterAssistant\cache\champions")) { throw "Champion cache missing" }
          if (!(Test-Path "release\WildRiftCounterAssistant\cache\items")) { throw "Item cache missing" }
          $builderZip = "release\WildRiftCounterAssistant_v" + $version + "_PC_Builder_Free.zip"
          if (!(Test-Path $builderZip)) { throw "PC Builder ZIP not found: $builderZip" }

      - name: Publish WRCA 3.9.2 PC portable release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "wild_rift\VERSION.txt" -Raw).Trim()
          $zip = "wild_rift\release\WildRiftCounterAssistant-$version-Portable-FREE.zip"
          $builder = "wild_rift\release\WildRiftCounterAssistant_v" + $version + "_PC_Builder_Free.zip"
          $tag = "wrca-pc-$version"
          gh release delete $tag --repo "${{ github.repository }}" --yes 2>$null
          git push origin ":refs/tags/$tag" 2>$null
          gh release create $tag $zip $builder --repo "${{ github.repository }}" --title "WRCA $version Windows PC" --notes "WRCA $version Windows portable + PC Builder. Same recommendation logic and GitHub data-package updater as Android 3.9.2."

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: FARLINER-Wild-Rift-Windows-3.9.2
          path: |
            wild_rift/release/WildRiftCounterAssistant-*-Portable-FREE.zip
            wild_rift/release/WildRiftCounterAssistant_v*_PC_Builder_Free.zip
          if-no-files-found: error
          retention-days: 14
