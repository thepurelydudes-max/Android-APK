name: Build WRCA Data Package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Optional data package version (blank = UTC date + run number)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".wrca-data-package-trigger"

permissions:
  contents: write
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore current verified WRCA package
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ZIP="${{ runner.temp }}/wrca-current.zip"
          CURRENT_DIR="${{ runner.temp }}/wrca-current"
          URL="$(python -c 'import json; print(json.load(open("wrca_data/latest.json", encoding="utf-8"))["download_url"])')"
          SHA="$(python -c 'import json; print(json.load(open("wrca_data/latest.json", encoding="utf-8"))["sha256"])')"

          if ! curl --fail --location --retry 2 --retry-all-errors "$URL" -o "$CURRENT_ZIP"; then
            echo "Initial WRCA release is not published yet; bootstrapping from the last verified legacy package."
            URL="$(python -c 'import json; print(json.load(open("wlca_data/latest.json", encoding="utf-8"))["download_url"])')"
            SHA="$(python -c 'import json; print(json.load(open("wlca_data/latest.json", encoding="utf-8"))["sha256"])')"
            curl --fail --location --retry 3 --retry-all-errors "$URL" -o "$CURRENT_ZIP"
          fi
          echo "$SHA  $CURRENT_ZIP" | sha256sum --check --status || {
            echo "::error::Current WRCA bootstrap package SHA-256 mismatch."
            exit 1
          }

          rm -rf "$CURRENT_DIR"
          mkdir -p "$CURRENT_DIR"
          unzip -q "$CURRENT_ZIP" -d "$CURRENT_DIR"
          test -f "$CURRENT_DIR/data/wildrift.db" || {
            echo "::error::Current WRCA package has no data/wildrift.db."
            exit 1
          }
          test -d "$CURRENT_DIR/cache" || {
            echo "::error::Current WRCA package has no cache/."
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/wild_rift/assets/cache" "$GITHUB_WORKSPACE/wild_rift/assets/data"
          mkdir -p "$GITHUB_WORKSPACE/wild_rift/assets"
          cp -a "$CURRENT_DIR/cache" "$GITHUB_WORKSPACE/wild_rift/assets/"
          cp -a "$CURRENT_DIR/data" "$GITHUB_WORKSPACE/wild_rift/assets/"

      - name: Apply GPT-prepared data changes
        shell: bash
        run: |
          set -euo pipefail
          python wrca_data/source/apply_update.py --assets-root wild_rift/assets

      - name: Download audited WRCA rune seed
        uses: actions/download-artifact@v4
        with:
          name: WRCA-3.9.3-full-rune-database
          path: ${{ runner.temp }}/wrca-rune-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37123062121

      - name: Merge full rune dataset into official WRCA data
        shell: bash
        run: |
          set -euo pipefail
          SEED_ROOT="${{ runner.temp }}/wrca-rune-seed/wrca-full-runes"
          test -f "$SEED_ROOT/data/wildrift.db"
          test -d "$SEED_ROOT/cache/runes"
          python wrca_data/source/merge_rune_seed.py             --assets-root wild_rift/assets             --seed-root "$SEED_ROOT"
          python wild_rift/apply_rune_localization_ru.py --db wild_rift/assets/data/wildrift.db

      - name: Choose package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.package_version }}"
          if [[ -n "$REQUESTED" ]]; then
            VERSION="$REQUESTED"
          else
            VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          fi
          TAG="wrca-data-$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/wrca-data
          python wrca_data/build_package.py             --assets-root wild_rift/assets             --output dist/wrca-data             --package-version "${{ steps.version.outputs.version }}"             --release-tag "${{ steps.version.outputs.tag }}"             --min-app-version "3.9.5"
          cat dist/wrca-data/latest.json

      - name: Publish immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="$(find dist/wrca-data -maxdepth 1 -name 'WRCA-data-*.zip' -print -quit)"
          SHA="$ZIP.sha256"
          gh release create "${{ steps.version.outputs.tag }}"             "$ZIP" "$SHA" dist/wrca-data/manifest.json dist/wrca-data/latest.json             --repo "${{ github.repository }}"             --title "WRCA Data ${{ steps.version.outputs.version }}"             --notes-file dist/wrca-data/release-notes.md

      - name: Point APK updater to the new verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The package source restoration intentionally modifies tracked assets
          # in the runner. Drop those temporary changes before rebasing the tiny
          # latest.json pointer commit; dist/ remains untracked and intact.
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          cp dist/wrca-data/latest.json wrca_data/latest.json
          git add wrca_data/latest.json
          if git diff --cached --quiet; then
            echo "latest.json already points to this package"
          else
            git commit -m "Publish WRCA data ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: WRCA-data-${{ steps.version.outputs.version }}
          path: |
            dist/wrca-data/manifest.json
            dist/wrca-data/latest.json
            dist/wrca-data/*.sha256
            dist/wrca-data/release-notes.md
          if-no-files-found: error
          retention-days: 30
