name: Diagnose WRC Reader Links
on:
  push:
    branches: [main]
    paths: [".wrc-reader-links-trigger"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "requests>=2.32.0" "beautifulsoup4>=4.12.0"
      - run: cd wild_rift && python diagnose_wrc_reader_links.py
