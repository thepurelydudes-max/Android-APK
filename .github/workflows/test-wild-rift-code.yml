name: Test Wild Rift Code

on:
  push:
    branches: [main]
    paths:
      - ".test-wild-rift-trigger"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Wild Rift tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
          cd wild_rift
          python -m py_compile db.py engine.py sources.py updater.py main.py paths.py prepare_bundled_seed.py
          python -m unittest -v test_regressions.py
