name: Probe WR Pocket Rune Lanes

on:
  push:
    branches:
      - wrca-runes-3.9.3-test
    paths:
      - ".wrp-runes-probe-trigger"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect lane controls and rune data
        shell: bash
        run: |
          python - <<'PY'
          import re, requests, json
          from bs4 import BeautifulSoup
          url="https://wrpocket.app/en/champions/malphite"
          r=requests.get(url,headers={"User-Agent":"Mozilla/5.0 WRCA-Rune-Audit/1"},timeout=45)
          print("STATUS",r.status_code,"LEN",len(r.text),r.url)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          for tag in soup.find_all(["form","select","option","button","a","input"]):
              txt=" ".join(tag.get_text(" ",strip=True).split())
              attrs={k:v for k,v in tag.attrs.items() if k in {"name","value","href","action","id","class","data-lane","data-role","data-url","hx-get","hx-post","hx-target"}}
              blob=(txt+" "+str(attrs)).casefold()
              if any(x in blob for x in ("lane","top","support","build trend","rune")):
                  if len(txt)<100:
                      print("CTRL",tag.name,repr(txt),attrs)
          print("SCRIPT_SRCS",[s.get("src") for s in soup.find_all("script") if s.get("src")])
          lane_buttons=soup.select(".wrp-ci-lanetab")
          for bi,b in enumerate(lane_buttons):
              print("LANEBUTTON",bi,b.get_text(" ",strip=True),b.attrs)
              p=b.parent
              for depth in range(4):
                  if not p: break
                  print("LANE_PARENT",bi,depth,p.name,p.attrs,str(p)[:5000].replace("\n"," "))
                  p=p.parent
          for tag in soup.find_all(class_=lambda c: c and "lane" in " ".join(c if isinstance(c,list) else [c]).casefold()):
              txt=" ".join(tag.get_text(" ",strip=True).split())
              if len(txt)<200:
                  print("LANECLASS",tag.name,tag.get("class"),tag.attrs,repr(txt))
          # Inspect Build Trends lane switch and all pre-rendered data panels.
          sw=soup.select_one(".wrp-cnb-switch.wrp-cnb-sw-lane")
          print("CNB_SWITCH", sw.attrs if sw else None, "TEXT", " ".join(sw.get_text(" ",strip=True).split()) if sw else "")
          if sw:
              p=sw.parent
              for depth in range(5):
                  if not p: break
                  print("CNB_PARENT",depth,p.name,p.attrs,str(p)[:12000].replace("\n"," "))
                  p=p.parent

          cnb_tags=[]
          for tag in soup.find_all(True):
              attrs=" ".join(f"{k}={v}" for k,v in tag.attrs.items())
              classes=" ".join(tag.get("class") or [])
              blob=(attrs+" "+classes).casefold()
              if "cnb" in blob:
                  txt=" ".join(tag.get_text(" ",strip=True).split())
                  if len(txt)<1200:
                      cnb_tags.append((tag.name,tag.attrs,txt))
          print("CNB_TAG_COUNT",len(cnb_tags))
          for row in cnb_tags[:500]:
              print("CNBTAG",row)

          # Summarize every pre-rendered rank:lane Build Trends panel.
          for panel in soup.select(".wrp-cnb-panel[data-cnb-for]"):
              key=panel.get("data-cnb-for")
              groups=[]
              for gi,g in enumerate(panel.select(":scope > .wrp-cnb-group, :scope > .wrp-cnb-2col > .wrp-cnb-group")):
                  txt=" ".join(g.get_text(" ",strip=True).split())
                  # Determine group by number of icons in a row: runes=5, spells=2, items=3.
                  rows=[]
                  for row in g.select("ol.wrp-cnb-tbl > li.wrp-cnb-row:not(.wrp-cnb-head)"):
                      names=[x.get_text(" ",strip=True) for x in row.select(".wrp-cnb-icons .wrp-cnb-sr")]
                      pick=(row.select_one(".wrp-cnb-bar").get_text(" ",strip=True) if row.select_one(".wrp-cnb-bar") else "")
                      win=(row.select_one(".wrp-cnb-wr").get_text(" ",strip=True) if row.select_one(".wrp-cnb-wr") else "")
                      if names:
                          rows.append((names,pick,win))
                  if rows:
                      groups.append((gi,len(rows[0][0]),rows[:2]))
              print("PANELSUMMARY",key,groups)

          # Rune combo rows with their nearest Build Trends ancestors.
          for ri,tag in enumerate(soup.find_all(class_=lambda x: x and "rune" in " ".join(x if isinstance(x,list) else [x]).casefold())):
              txt=" ".join(tag.get_text(" ",strip=True).split())
              if not txt or len(txt)>1000: continue
              print("RUNECLASS",ri,tag.name,tag.attrs,repr(txt))
              p=tag.parent
              for depth in range(5):
                  if not p: break
                  attrs=p.attrs
                  if any("cnb" in str(v).casefold() or "trend" in str(v).casefold() or "lane" in str(v).casefold() for v in attrs.values()):
                      print("RUNEANC",ri,depth,p.name,attrs)
                  p=p.parent

          # Find JS/JSON fragments mentioning lane + runes or endpoints.
          for s in soup.find_all("script"):
              body=s.string or s.get_text("\n")
              low=body.casefold()
              if "lane" in low and ("rune" in low or "build" in low):
                  for needle in ("wrp-ci-lanetab","fetch(","trend","lane"):
                      pos=0
                      shown=0
                      while True:
                          idx=low.find(needle,pos)
                          if idx<0 or shown>=8: break
                          a=max(0,idx-700); b=min(len(body),idx+1800)
                          print("SCRIPTCTX",needle,body[a:b].replace("\n"," "))
                          pos=idx+len(needle); shown+=1
          for m in re.finditer(r'https?://[^"\'\s<>]+|/[A-Za-z0-9_/?=&.-]+',r.text):
              val=m.group(0)
              low=val.casefold()
              if ("lane" in low or "build" in low) and ("api" in low or "champion" in low):
                  print("URLCAND",val[:500])
          # Inspect external scripts that populate inactive Build Trends panels.
          base="https://wrpocket.app"
          external=[s.get("src") for s in soup.find_all("script") if s.get("src") and ("champion-sections" in s.get("src") or "data-manager" in s.get("src"))]
          external.append("/components/build-trends-ui.js?v=7.3a-cc0af4f8")
          for src in external:
              js=requests.get(base+src,headers={"User-Agent":"Mozilla/5.0 WRCA-Rune-Audit/1"},timeout=45)
              print("EXTJS",src,js.status_code,len(js.text))
              body=js.text
              low=body.casefold()
              for needle2 in ("cnb","data-cnb","build trend","fetch(","site_data","combo","runes"):
                  pos=0; shown=0
                  while True:
                      idx=low.find(needle2,pos)
                      if idx<0 or shown>=20: break
                      print("EXTCTX",src,needle2,body[max(0,idx-900):min(len(body),idx+2400)].replace("\n"," "))
                      pos=idx+len(needle2); shown+=1
          PY
