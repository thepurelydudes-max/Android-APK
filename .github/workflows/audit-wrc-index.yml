name: Audit WildRiftCore Build Index

on:
  push:
    branches: [main]
    paths:
      - ".audit-wrc-index-trigger"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Count WRC build profiles and resolver coverage
        shell: bash
        run: |
          python -m pip install -q "requests>=2.32.0" "beautifulsoup4>=4.12.0" "Pillow>=10.4.0"
          set -euo pipefail
          curl -L -sS --max-time 60 \
            'https://r.jina.ai/https://wildriftcore.com/en/builds/' \
            -o /tmp/wrc-builds.txt
          grep -o -E 'https://wildriftcore\.com/en/champions/[^/?#)]+/builds/?' /tmp/wrc-builds.txt \
            | sed -E 's#https://wildriftcore\.com/en/champions/([^/]+)/builds/?#\1#' \
            | sort -u > /tmp/slugs.txt
          echo "WRC_PROFILE_COUNT=$(wc -l < /tmp/slugs.txt)"
          cat /tmp/slugs.txt

          echo "=== SAMPLE AGGREGATE ROWS ==="
          python - <<'PY'
          from pathlib import Path
          lines=Path("/tmp/wrc-builds.txt").read_text(errors="replace").splitlines()
          for needle in ("malphite","aatrox","ahri","jax"):
              print("\n###", needle)
              hits=[i for i,x in enumerate(lines) if needle in x.casefold()]
              for i in hits[:3]:
                  for j in range(max(0,i-3),min(len(lines),i+8)):
                      print(f"{j+1}: {lines[j]}")
          PY

          echo "=== AATROX PAGE MARKERS ==="
          curl -L -sS --max-time 60 'https://r.jina.ai/https://wildriftcore.com/en/champions/aatrox/builds/' -o /tmp/aatrox.txt
          grep -n -E 'recommended build|^#### |Situational adaptations|When to pick it|Best Aatrox build' /tmp/aatrox.txt | head -120 || true
          echo "=== AATROX RAW VARIANT BLOCK ==="
          sed -n '24,62p' /tmp/aatrox.txt

          cd "$GITHUB_WORKSPACE/wild_rift"
          echo "=== AATROX PARSER RESULT ==="
          python - <<'PY'
          import json, pathlib
          import sources
          p=sources.parse_wildriftcore_build_page(pathlib.Path("/tmp/aatrox.txt").read_text(errors="replace"), "Aatrox", [])
          print(json.dumps({
              "builds": p.get("builds"),
              "variants": p.get("variants"),
              "situational": p.get("situational"),
              "boots": p.get("boots"),
          }, ensure_ascii=False, indent=2))
          PY

          python - <<'PY'
          import pathlib
          import sources
          import updater
          from sources import Net

          net = Net()
          champs = updater.merge_champion_locales(
              sources.fetch_champions_locale(net, "en_US"),
              sources.fetch_champions_locale(net, "ru_RU"),
          )
          try:
              champs = updater.merge_champion_roster_supplement(
                  champs, sources.fetch_wildriftmeta_champion_roster(net)
              )
          except Exception:
              pass
          resolve = updater.build_resolver(champs)
          slugs = [x.strip() for x in pathlib.Path("/tmp/slugs.txt").read_text().splitlines() if x.strip()]
          missing = [slug for slug in slugs if not (resolve(slug) or resolve(slug.replace("-", " ")))]
          resolved = {
              (resolve(slug) or resolve(slug.replace("-", " ")))
              for slug in slugs
              if (resolve(slug) or resolve(slug.replace("-", " ")))
          }
          champ_ids = {str(c["id"]) for c in champs}
          print(f"ROSTER={len(champ_ids)} RESOLVED_WRC={len(resolved)}")
          print("UNRESOLVED_WRC=" + ",".join(missing))
          print("ROSTER_WITHOUT_WRC=" + ",".join(sorted(champ_ids - resolved)))
          PY
