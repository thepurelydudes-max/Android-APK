name: Audit Full WRCA Rune Coverage

on:
  push:
    branches:
      - wrca-runes-3.9.3-test
    paths:
      - ".runes-collect-trigger"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Restore current verified WRCA 7.3a package
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python -c 'import json; print(json.load(open("wrca_data/latest.json", encoding="utf-8"))["download_url"])')"
          SHA="$(python -c 'import json; print(json.load(open("wrca_data/latest.json", encoding="utf-8"))["sha256"])')"
          curl --fail --location --retry 3 --retry-all-errors "$URL" -o /tmp/wrca.zip
          echo "$SHA  /tmp/wrca.zip" | sha256sum --check --status
          rm -rf /tmp/wrca-runes
          mkdir -p /tmp/wrca-runes
          unzip -q /tmp/wrca.zip -d /tmp/wrca-runes
      - name: Collect every champion-role rune page
        shell: bash
        run: |
          set -euo pipefail
          python wild_rift/collect_wrf_runes.py             --db /tmp/wrca-runes/data/wildrift.db             --cache /tmp/wrca-runes/cache             --expected-patch 7.3a             --audit-json /tmp/rune-audit.json
          python - <<'PY'
          import json, sqlite3
          a=json.load(open("/tmp/rune-audit.json",encoding="utf-8"))
          print("=== COVERAGE SUMMARY ===")
          for k in (
            "guide_links","database_champions","resolved_guides","role_pages",
            "unique_runes","situational_rules","rune_icons",
            "role_build_pairs","covered_recommendation_pairs"
          ):
              print(k, a[k])
          print("unresolved_guides", json.dumps(a["unresolved_guides"],ensure_ascii=False))
          print("missing_recommendation_pairs", json.dumps(a["missing_recommendation_pairs"],ensure_ascii=False))
          print("malformed_count", len(a["malformed_pages"]))
          db="/tmp/wrca-runes/data/wildrift.db"
          with sqlite3.connect(db) as con:
              assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              print("db role_runes", con.execute("SELECT COUNT(*) FROM role_runes").fetchone()[0])
              print("db runes", con.execute("SELECT COUNT(*) FROM runes").fetchone()[0])
          PY
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: wrca-rune-coverage-audit
          path: /tmp/rune-audit.json
          if-no-files-found: error
          retention-days: 14
