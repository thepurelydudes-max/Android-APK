name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project to build"
        required: true
        default: "wild_rift"
        type: choice
        options:
          - wild_rift
          - mlbb
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.1"
          flet --version

      - name: Verify source folders
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.project }}" == "wild_rift" || "${{ inputs.project }}" == "both" ]]; then
            test -f wild_rift/main.py || { echo "wild_rift/main.py is missing. Run Import full SRC archives first."; exit 1; }
          fi
          if [[ "${{ inputs.project }}" == "mlbb" || "${{ inputs.project }}" == "both" ]]; then
            test -f mlbb/main.py || { echo "mlbb/main.py is missing. Run Import full SRC archives first."; exit 1; }
          fi

      - name: Build Wild Rift APK
        if: ${{ inputs.project == 'wild_rift' || inputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk_output/wild_rift"
          flet build apk "$GITHUB_WORKSPACE/wild_rift" \
            --output "$GITHUB_WORKSPACE/apk_output/wild_rift" \
            --python-version 3.12 \
            --yes \
            --verbose

      - name: Build MLBB APK
        if: ${{ inputs.project == 'mlbb' || inputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk_output/mlbb"
          flet build apk "$GITHUB_WORKSPACE/mlbb" \
            --output "$GITHUB_WORKSPACE/apk_output/mlbb" \
            --python-version 3.12 \
            --yes \
            --verbose

      - name: Show APK files
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/apk_output" -type f -maxdepth 5 -print || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FARLINER-${{ inputs.project }}-APK
          path: apk_output/
          if-no-files-found: error
          retention-days: 14
