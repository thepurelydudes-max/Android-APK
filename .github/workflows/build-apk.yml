name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project to build"
        required: true
        default: "wild_rift"
        type: choice
        options:
          - wild_rift
          - mlbb
          - both
  push:
    branches:
      - main
    paths:
      - ".build-trigger"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select project
        id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "project=${{ inputs.project }}" >> "$GITHUB_OUTPUT"
          elif grep -qi "wild rift" .build-trigger 2>/dev/null; then
            echo "project=wild_rift" >> "$GITHUB_OUTPUT"
          elif grep -qi "mlbb" .build-trigger 2>/dev/null; then
            echo "project=mlbb" >> "$GITHUB_OUTPUT"
          else
            echo "project=both" >> "$GITHUB_OUTPUT"
          fi
          if grep -qi "preseeded" .build-trigger 2>/dev/null; then
            echo "preseeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "preseeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download canonical 3.7.12 APK seed
        if: ${{ (steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both') && steps.select.outputs.preseeded == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: FARLINER-Wild-Rift-APK
          path: ${{ runner.temp }}/wrca_base_apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36425019210

      - name: Download canonical MLCA full seed
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        uses: actions/download-artifact@v4
        with:
          name: MLCA-2.1.1-APK
          path: ${{ runner.temp }}/mlca_base_apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36627935879

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==1.0.1"
          flet --version

      - name: Verify source folders
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.select.outputs.project }}"
          if [[ "$PROJECT" == "wild_rift" || "$PROJECT" == "both" ]]; then
            test -f wild_rift/main.py || { echo "wild_rift/main.py is missing."; exit 1; }
            test -d wild_rift/assets || { echo "wild_rift/assets is missing."; exit 1; }
          fi
          if [[ "$PROJECT" == "mlbb" || "$PROJECT" == "both" ]]; then
            test -f mlbb/main.py || { echo "mlbb/main.py is missing."; exit 1; }
            test -d mlbb/assets || { echo "mlbb/assets is missing."; exit 1; }
          fi

      - name: Restore canonical MLCA full role-build seed
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ runner.temp }}/mlca_base_apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -f "$APK" || { echo "::error::Canonical MLCA APK artifact not found."; exit 1; }

          unzip -p "$APK" assets/app.zip > "${{ runner.temp }}/mlca_base_app.zip"
          rm -rf "${{ runner.temp }}/mlca_base_app"
          mkdir -p "${{ runner.temp }}/mlca_base_app"
          unzip -q "${{ runner.temp }}/mlca_base_app.zip" 'assets/data/mobilelegends.db' -d "${{ runner.temp }}/mlca_base_app"
          cp "${{ runner.temp }}/mlca_base_app/assets/data/mobilelegends.db" "$GITHUB_WORKSPACE/mlbb/assets/data/mobilelegends.db"

          python - <<'PY'
          import sqlite3
          db_path = "mlbb/assets/data/mobilelegends.db"
          con = sqlite3.connect(db_path)
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          role_builds = con.execute("SELECT COUNT(*) FROM role_builds").fetchone()[0]
          assert role_builds >= 160, role_builds
          print(f"Canonical MLCA bootstrap role builds: {role_builds}")
          PY

      - name: Restore updated 3.7.12 preseed without network refresh
        if: ${{ (steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both') && steps.select.outputs.preseeded == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ runner.temp }}/wrca_base_apk" -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -f "$APK" || { echo "::error::Base 3.7.12 APK artifact not found."; exit 1; }

          cp "$GITHUB_WORKSPACE/wild_rift/assets/cache/items/Soul_Transfer.png" "${{ runner.temp }}/Soul_Transfer.png"
          unzip -p "$APK" assets/app.zip > "${{ runner.temp }}/wrca_app.zip"
          rm -rf "$GITHUB_WORKSPACE/wild_rift/assets/cache" "$GITHUB_WORKSPACE/wild_rift/assets/data"
          rm -rf "${{ runner.temp }}/wrca_app"
          mkdir -p "${{ runner.temp }}/wrca_app"
          unzip -q "${{ runner.temp }}/wrca_app.zip" 'assets/cache/*' 'assets/data/*' -d "${{ runner.temp }}/wrca_app"
          cp -a "${{ runner.temp }}/wrca_app/assets/cache" "$GITHUB_WORKSPACE/wild_rift/assets/"
          cp -a "${{ runner.temp }}/wrca_app/assets/data" "$GITHUB_WORKSPACE/wild_rift/assets/"
          cp "${{ runner.temp }}/Soul_Transfer.png" "$GITHUB_WORKSPACE/wild_rift/assets/cache/items/Soul_Transfer.png"

          python - <<'PY'
          from pathlib import Path
          import base64, datetime, hashlib, json, lzma, sqlite3

          root = Path("wild_rift")
          db_path = root / "assets" / "data" / "wildrift.db"
          patch_path = root / "preseed" / "pc_updated_3_7_12.sql.xz.b64"
          sql = lzma.decompress(base64.b64decode(patch_path.read_text(encoding="ascii"))).decode("utf-8")

          con = sqlite3.connect(db_path)
          con.executescript(sql)
          con.commit()
          assert con.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert con.execute("SELECT COUNT(*) FROM champions").fetchone()[0] == 142
          assert con.execute("SELECT COUNT(*) FROM items").fetchone()[0] == 118
          assert con.execute("SELECT COUNT(*) FROM matchups").fetchone()[0] == 9606
          assert con.execute("SELECT COUNT(*) FROM role_builds").fetchone()[0] == 226
          assert con.execute("SELECT COUNT(*) FROM role_build_variants").fetchone()[0] == 678
          assert con.execute("SELECT COUNT(*) FROM build_page_cache").fetchone()[0] == 142
          assert con.execute("SELECT COUNT(*) FROM matchup_page_cache").fetchone()[0] == 142
          assert con.execute("SELECT name_ru FROM items WHERE name='Boots of Mana'").fetchone()[0] == "Сапоги маны"
          meta = dict(con.execute("SELECT key,value FROM meta"))
          audit = {
              "champions_total": con.execute("SELECT COUNT(*) FROM champions").fetchone()[0],
              "items_total": con.execute("SELECT COUNT(*) FROM items").fetchone()[0],
              "matchups": con.execute("SELECT COUNT(*) FROM matchups").fetchone()[0],
              "champion_tiers": con.execute("SELECT COUNT(*) FROM champion_tiers").fetchone()[0],
              "stats": con.execute("SELECT COUNT(*) FROM stats").fetchone()[0],
              "wrc_role_builds": con.execute("SELECT COUNT(*) FROM role_builds").fetchone()[0],
              "wrc_role_variants": con.execute("SELECT COUNT(*) FROM role_build_variants").fetchone()[0],
              "wrc_situational": con.execute("SELECT COUNT(*) FROM role_build_situational").fetchone()[0],
              "wrc_opponent_adaptations": con.execute("SELECT COUNT(*) FROM role_build_opponent_adaptations").fetchone()[0],
              "wrc_champion_traits": con.execute("SELECT COUNT(*) FROM champion_traits").fetchone()[0],
              "wrc_build_cache_pages": con.execute("SELECT COUNT(*) FROM build_page_cache").fetchone()[0],
              "matchup_cache_pages": con.execute("SELECT COUNT(*) FROM matchup_page_cache").fetchone()[0],
              "item_pools": con.execute("SELECT COUNT(*) FROM item_pools").fetchone()[0],
              "counter_items": con.execute("SELECT COUNT(*) FROM counter_items").fetchone()[0],
              "boots_of_mana_ru": "Сапоги маны",
          }
          con.close()

          champ_icons = len(list((root / "assets" / "cache" / "champions").glob("*.png")))
          item_icons = len(list((root / "assets" / "cache" / "items").glob("*.png")))
          assert champ_icons == 142, champ_icons
          assert item_icons == 118, item_icons

          manifest = {
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "updated PC 3.7.12 database/cache; no external data refresh during build",
              "base_apk_run": 36425019210,
              "patch": meta.get("patch_version", "7.3"),
              "last_update": meta.get("last_update", ""),
              "database_sha256": hashlib.sha256(db_path.read_bytes()).hexdigest(),
              "audit": audit,
          }
          (root / "assets" / "data" / "bundled_seed_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Test Wild Rift recommendation engine
        if: ${{ steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "requests>=2.32.0" "Pillow>=10.4.0" "beautifulsoup4>=4.12.0"
          cd "$GITHUB_WORKSPACE/wild_rift"
          python -m py_compile db.py draft_matrix_engine.py engine.py sources.py updater.py main.py prepare_bundled_seed.py
          python -m unittest -v test_regressions.py

      - name: Refresh bundled Wild Rift database and media
        if: ${{ (steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both') && steps.select.outputs.preseeded != 'true' }}
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/wrca_bundled_seed
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          rm -rf "$FLET_APP_STORAGE_DATA"
          cd "$GITHUB_WORKSPACE/wild_rift"
          python prepare_bundled_seed.py
          echo "Bundled seed manifest:"
          cat "$GITHUB_WORKSPACE/wild_rift/assets/data/bundled_seed_manifest.json"

      - name: Test MLBB recommendation engine
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r "$GITHUB_WORKSPACE/mlbb/requirements.txt"
          cd "$GITHUB_WORKSPACE/mlbb"
          python -m py_compile db.py data_contract.py draft_matrix_engine.py engine.py sources.py updater.py main.py prepare_bundled_seed.py
          python -m unittest -v test_regressions.py test_data_contract.py

      - name: Refresh bundled MLBB database and media
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/mlca_bundled_seed
          FLET_ASSETS_DIR: ${{ github.workspace }}/mlbb/assets
        run: |
          set -euo pipefail
          rm -rf "$FLET_APP_STORAGE_DATA"
          cd "$GITHUB_WORKSPACE/mlbb"
          python prepare_bundled_seed.py
          echo "Bundled MLBB seed manifest:"
          cat "$GITHUB_WORKSPACE/mlbb/assets/data/bundled_seed_manifest.json"

      - name: Prepare lean MLBB runtime project
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_PROJECT="${{ runner.temp }}/mlbb_runtime"
          rm -rf "$RUNTIME_PROJECT"
          mkdir -p "$RUNTIME_PROJECT"

          for file in \
            main.py \
            db.py \
            engine.py \
            draft_matrix_engine.py \
            data_contract.py \
            sources.py \
            updater.py \
            media_cache.py \
            paths.py \
            localization.py \
            adaptive_descriptions.py \
            VERSION.txt \
            requirements.txt; do
            cp "$GITHUB_WORKSPACE/mlbb/$file" "$RUNTIME_PROJECT/$file"
          done
          cp -a "$GITHUB_WORKSPACE/mlbb/assets" "$RUNTIME_PROJECT/assets"

          for dead in \
            test_regressions.py \
            test_data_contract.py \
            collect_mlbb_snapshot.py \
            moonton_gms.py \
            prepare_bundled_seed.py \
            README_REWORK_RU.txt; do
            test ! -e "$RUNTIME_PROJECT/$dead"
          done

          echo "Lean MLBB runtime project:"
          find "$RUNTIME_PROJECT" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Prepare lean Wild Rift runtime project
        if: ${{ steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_PROJECT="${{ runner.temp }}/wild_rift_runtime"
          rm -rf "$RUNTIME_PROJECT"
          mkdir -p "$RUNTIME_PROJECT"

          for file in \
            main.py \
            db.py \
            engine.py \
            draft_matrix_engine.py \
            sources.py \
            updater.py \
            media_cache.py \
            paths.py \
            localization.py \
            adaptive_descriptions.py \
            VERSION.txt \
            requirements.txt; do
            cp "$GITHUB_WORKSPACE/wild_rift/$file" "$RUNTIME_PROJECT/$file"
          done
          cp -a "$GITHUB_WORKSPACE/wild_rift/assets" "$RUNTIME_PROJECT/assets"

          # Android runtime must not carry tests, diagnostics, PC builders or
          # seed-generation utilities. They stay in the repository for
          # development but are deliberately excluded from the APK payload.
          for dead in \
            test_regressions.py \
            build_pc_release.py \
            collect_wrc_snapshot.py \
            desktop_main.py \
            diagnose_item_icons.py \
            inventory_wrc_snapshot.py \
            prepare_bundled_seed.py; do
            test ! -e "$RUNTIME_PROJECT/$dead"
          done

          echo "Lean Wild Rift runtime project:"
          find "$RUNTIME_PROJECT" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Build Wild Rift APK
        if: ${{ steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk_output/wild_rift"

          RUNTIME_PROJECT="${{ runner.temp }}/wild_rift_runtime"
          BUILD_VERSION="$(tr -d '[:space:]' < "$RUNTIME_PROJECT/VERSION.txt")"
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::wild_rift/VERSION.txt must contain x.y.z, got: $BUILD_VERSION"
            exit 1
          fi
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          echo "Wild Rift Android identity: com.flet.wild_rift"
          echo "Wild Rift versionName=$BUILD_VERSION versionCode=$BUILD_NUMBER"

          for attempt in 1 2; do
            echo "Wild Rift APK build attempt $attempt/2"
            if flet build apk "$RUNTIME_PROJECT" \
              --project "wild_rift" \
              --product "WR Counter Assistant" \
              --artifact "WR_Counter_Assistant" \
              --org "com.flet" \
              --bundle-id "com.flet.wild_rift" \
              --build-version "$BUILD_VERSION" \
              --build-number "$BUILD_NUMBER" \
              --output "$GITHUB_WORKSPACE/apk_output/wild_rift" \
              --python-version 3.12 \
              --yes \
              --verbose; then
              break
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "Wild Rift APK build failed twice."
              exit 1
            fi
            echo "Transient Android/Flet failure; cleaning build state and retrying once..."
            rm -rf "$RUNTIME_PROJECT/build" "$GITHUB_WORKSPACE/apk_output/wild_rift"
            mkdir -p "$GITHUB_WORKSPACE/apk_output/wild_rift"
            sleep 10
          done

      - name: Build MLBB APK
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk_output/mlbb"

          RUNTIME_PROJECT="${{ runner.temp }}/mlbb_runtime"
          BUILD_VERSION="$(tr -d '[:space:]' < "$RUNTIME_PROJECT/VERSION.txt")"
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::mlbb/VERSION.txt must contain x.y.z, got: $BUILD_VERSION"
            exit 1
          fi
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          echo "MLBB Android identity: com.flet.mlbb"
          echo "MLBB versionName=$BUILD_VERSION versionCode=$BUILD_NUMBER"

          for attempt in 1 2; do
            echo "MLBB APK build attempt $attempt/2"
            if flet build apk "$RUNTIME_PROJECT" \
              --project "mlbb" \
              --product "MLBB Counter Assistant" \
              --artifact "MLBB_Counter_Assistant" \
              --org "com.flet" \
              --bundle-id "com.flet.mlbb" \
              --build-version "$BUILD_VERSION" \
              --build-number "$BUILD_NUMBER" \
              --output "$GITHUB_WORKSPACE/apk_output/mlbb" \
              --python-version 3.12 \
              --yes \
              --verbose; then
              break
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "MLBB APK build failed twice."
              exit 1
            fi
            echo "Transient Android/Flet failure; cleaning build state and retrying once..."
            rm -rf "$RUNTIME_PROJECT/build" "$GITHUB_WORKSPACE/apk_output/mlbb"
            mkdir -p "$GITHUB_WORKSPACE/apk_output/mlbb"
            sleep 10
          done

      - name: Show APK files
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/apk_output" -type f -maxdepth 5 -print || true

      - name: Upload Wild Rift APK
        if: ${{ steps.select.outputs.project == 'wild_rift' || steps.select.outputs.project == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: FARLINER-Wild-Rift-APK
          path: apk_output/wild_rift/
          if-no-files-found: error
          retention-days: 14

      - name: Read MLCA version
        id: mlca_version
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        shell: bash
        run: |
          echo "version=$(tr -d '[:space:]' < mlbb/VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload MLBB APK
        if: ${{ steps.select.outputs.project == 'mlbb' || steps.select.outputs.project == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: MLCA-${{ steps.mlca_version.outputs.version }}-APK
          path: apk_output/mlbb/
          if-no-files-found: error
          retention-days: 14
