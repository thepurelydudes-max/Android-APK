name: Probe WildRiftCore Direct Access

on:
  push:
    branches: [main]
    paths:
      - ".probe-wrc-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe WildRiftCore endpoints
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          urls=(
            'https://wildriftcore.com/en/champions/'
            'https://wildriftcore.com/en/builds/'
            'https://wildriftcore.com/en/champions/malphite/builds/'
            'https://wildriftcore.com/champions/malphite/builds/'
            'https://www.wildriftcore.com/en/champions/malphite/builds/'
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            curl -L -sS -A "$UA" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: en-US,en;q=0.9'               -o /tmp/wrc-body.html -D /tmp/wrc-headers.txt --max-time 30 -w 'HTTP=%{http_code} SIZE=%{size_download} FINAL=%{url_effective}\n' "$url" || true
            head -20 /tmp/wrc-headers.txt || true
            grep -o -m1 -E '<title>[^<]+' /tmp/wrc-body.html || true
            grep -o -m1 -E 'Best Malphite build[^<]{0,300}' /tmp/wrc-body.html || true
            echo
          done

      - name: Probe Jina Reader fallback
        shell: bash
        run: |
          set -u
          for url in \
            'https://r.jina.ai/https://wildriftcore.com/en/champions/malphite/builds/' \
            'https://r.jina.ai/https://wildriftcore.com/en/builds/'; do
            echo "=== JINA $url ==="
            curl -L -sS --max-time 60 -o /tmp/jina.txt -D /tmp/jina.headers \
              -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$url" || true
            head -10 /tmp/jina.headers || true
            grep -m1 -F 'Best Malphite build' /tmp/jina.txt || true
            grep -m1 -F 'Malphite Baron Lane' /tmp/jina.txt || true
            head -12 /tmp/jina.txt || true
          done

      - name: Inspect Jina Malphite structure
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --max-time 60 \
            'https://r.jina.ai/https://wildriftcore.com/en/champions/malphite/builds/' \
            -o /tmp/malphite-jina.txt
          echo '=== section markers ==='
          grep -n -E 'recommended build|Situational adaptations|Adaptations by opponent|Vs AD|Vs AP|Standard|When to pick|Boots & enchant' /tmp/malphite-jina.txt | head -80 || true
          echo '=== situational vicinity ==='
          sed -n '205,238p' /tmp/malphite-jina.txt
          echo '=== recommended build vicinity ==='
          n="$(grep -n -m1 'recommended build' /tmp/malphite-jina.txt | cut -d: -f1 || true)"
          if [[ -n "$n" ]]; then
            start=$(( n > 20 ? n - 20 : 1 )); end=$(( n + 180 ))
            sed -n "${start},${end}p" /tmp/malphite-jina.txt
          fi

      - name: Probe Malphite variant structure
        shell: bash
        run: |
          curl -L -sS --max-time 60 \
            'https://r.jina.ai/https://wildriftcore.com/en/champions/malphite/builds/' \
            -o /tmp/malphite-jina.txt
          echo "=== variant markers ==="
          grep -n -Ei 'variant|vs[ ._-]*(ad|ap)|physical|magic|situational adaptations|adaptations by opponent' \
            /tmp/malphite-jina.txt | head -80 || true
          echo "=== selected context ==="
          LINE="$(grep -n -m1 -Ei 'vs[ ._-]*ad|physical.*comp' /tmp/malphite-jina.txt | cut -d: -f1 || true)"
          if [[ -n "$LINE" ]]; then
            START=$((LINE>20 ? LINE-20 : 1))
            END=$((LINE+80))
            sed -n "${START},${END}p" /tmp/malphite-jina.txt
          fi

      - name: Probe fresh Jina browser Aatrox
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS --max-time 90 \
            -H 'X-No-Cache: true' \
            -H 'X-Cache-Tolerance: 0' \
            -H 'X-Engine: browser' \
            -H 'X-Timeout: 45' \
            'https://r.jina.ai/https://wildriftcore.com/en/champions/aatrox/builds/' \
            -o /tmp/aatrox-fresh.txt
          echo "bytes=$(wc -c < /tmp/aatrox-fresh.txt)"
          grep -n -E 'Standard — bruiser|Anti-tank — shred|Sustain — brawler|Example enemy draft|Adaptations by opponent' /tmp/aatrox-fresh.txt | head -80 || true
          echo '=== fresh Aatrox variant block ==='
          sed -n '24,120p' /tmp/aatrox-fresh.txt

      - name: Probe with real headless Chrome
        shell: bash
        run: |
          set -u
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME" ]]; then
            echo "No Chrome/Chromium found"
            exit 0
          fi
          for url in             'https://wildriftcore.com/en/champions/malphite/builds/'             'https://wildriftcore.com/en/builds/'; do
            echo "=== CHROME $url ==="
            timeout 45 "$CHROME" --headless=new --no-sandbox --disable-gpu               --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom "$url"               > /tmp/wrc-chrome.html 2>/tmp/wrc-chrome.err || true
            echo "bytes=$(wc -c < /tmp/wrc-chrome.html)"
            grep -o -m1 -E '<title>[^<]+' /tmp/wrc-chrome.html || true
            grep -o -m1 -E 'Best Malphite build[^<]{0,300}' /tmp/wrc-chrome.html || true
            grep -o -m1 -E 'Cloudflare|Just a moment' /tmp/wrc-chrome.html || true
            tail -20 /tmp/wrc-chrome.err || true
          done
