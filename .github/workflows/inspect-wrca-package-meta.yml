name: Inspect WRCA Package Meta
on:
  push:
    branches: [main]
    paths: [".inspect-wrca-meta-trigger"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published WRCA package meta
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python -c 'import json; print(json.load(open("wrca_data/latest.json", encoding="utf-8"))["download_url"])')"
          curl --fail --location "$URL" -o /tmp/wrca.zip
          rm -rf /tmp/wrca && mkdir -p /tmp/wrca
          unzip -q /tmp/wrca.zip -d /tmp/wrca
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect("/tmp/wrca/data/wildrift.db")
          meta=dict(con.execute("SELECT key,value FROM meta"))
          print(json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True))
          con.close()
          PY


      - name: Audit selective 7.3b balance fields in currently published package
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect("/tmp/wrca/data/wildrift.db")
          con.row_factory=sqlite3.Row
          names=["Youmuu's Ghostblade","Locket of the Iron Solari","Thornmail","Warmog's Armor","Statikk Shiv","Yun Tal Wildarrows"]
          print("AUDIT_ITEMS_BEGIN")
          for name in names:
              rows=con.execute("SELECT name,name_ru,price,stats_json,effect_en,data_patch FROM items WHERE lower(name)=lower(?)",(name,)).fetchall()
              print(json.dumps({"target":name,"rows":[dict(x) for x in rows]},ensure_ascii=False))
          print("AUDIT_RUNES_BEGIN")
          for name in ["Electrocute","Cheap Shot","Grasp of Undying","Aery"]:
              rows=con.execute("SELECT name,name_ru,effect_en,effect_ru,patch FROM runes WHERE lower(name)=lower(?)",(name,)).fetchall()
              print(json.dumps({"target":name,"rows":[dict(x) for x in rows]},ensure_ascii=False))
          print("AUDIT_SOURCE_PATCHES_BEGIN")
          for table in ["champion_tiers","matchup_page_cache","build_page_cache","role_builds","role_runes","items","runes"]:
              col="data_patch" if table=="items" else "patch"
              try:
                  data=con.execute("SELECT "+col+",COUNT(*) FROM "+table+" GROUP BY "+col).fetchall()
                  print(table, json.dumps([list(x) for x in data],ensure_ascii=False))
              except sqlite3.OperationalError: pass
          print("AUDIT_MATCHUPS_SAMPLE_BEGIN")
          for name in ["Volibear","Jhin","Tryndamere","Yasuo","Hwei","Nocturne","Yunara","Senna"]:
              rows=con.execute("SELECT c.id,c.name,COUNT(*) AS n FROM champions c JOIN matchups m ON m.champion_id=c.id WHERE lower(c.name)=lower(?) GROUP BY c.id,c.name",(name,)).fetchall()
              print(name,json.dumps([dict(x) for x in rows],ensure_ascii=False))
          con.close()
          PY


      - name: Simulate 7.3b delta on a disposable copy (do not publish)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/wrca/data/wildrift.db /tmp/wrca/delta-audit.db
          python wrca_data/source/apply_7_3b_delta.py --db /tmp/wrca/delta-audit.db
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/tmp/wrca/delta-audit.db')
          for name in ["Youmuu's Ghostblade", "Locket of the Iron Solari", "Thornmail", "Warmog's Armor", "Statikk Shiv", "Yun Tal Wildarrows"]:
              print("POST_PATCH_ITEM:",con.execute("SELECT name,price,stats_json,effect_en,data_patch FROM items WHERE name=?",(name,)).fetchone())
          for name in ["Electrocute","Cheap Shot","Grasp of Undying","Aery"]:
              print("POST_PATCH_RUNE:",con.execute("SELECT name,effect_en,effect_ru,patch FROM runes WHERE name=?",(name,)).fetchone())
          PY


      - name: Compare specific old WRC matchup edges with publicly readable 7.3c pages
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect("/tmp/wrca/data/wildrift.db")
          pairs={"Yasuo":["Vex","Malphite","Lissandra","Brand"],"Volibear":["Gwen","Lillia","Kayn","Riven"]}
          for champion, opponents in pairs.items():
              for opp in opponents:
                  vals=con.execute(
                      "SELECT role,score,source FROM matchups WHERE champion_id=? AND enemy_id=?",
                      (champion,opp),
                  ).fetchall()
                  print("AUDIT_OLD_EDGE",json.dumps({"champion":champion,"opponent":opp,"stored":vals},ensure_ascii=False))
          PY


      - name: Inspect old item-and-rune choices for representative roles
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, json
          con=sqlite3.connect("/tmp/wrca/data/wildrift.db")
          pairs=[("Yasuo","Мид"),("Hwei","Мид"),("Jhin","ADC"),("Senna","Саппорт")]
          for champ,role in pairs:
              builds=con.execute("SELECT items_json,boot_name,source FROM role_builds WHERE champion_id=? AND role=?",(champ,role)).fetchall()
              runes=con.execute("SELECT runes_json,source FROM role_runes WHERE champion_id=? AND role=? ORDER BY source",(champ,role)).fetchall()
              print("AUDIT_OLD_BUILD_RUNE",json.dumps({"champ":champ,"role":role,"builds":builds,"runes":runes},ensure_ascii=False))
          PY


      - name: Audit exact source profile variants before selective 7.3c update
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,json
          con=sqlite3.connect('/tmp/wrca/data/wildrift.db')
          pairs=[('Yasuo','Мид'),('Yasuo','Барон'),('Hwei','Мид'),('Hwei','Саппорт'),('Jhin','ADC'),('Senna','Саппорт'),('Senna','ADC')]
          for cid,role in pairs:
              print('WRC_CURRENT_PROFILE',json.dumps({'champion':cid,'role':role,'standard':con.execute("SELECT items_json,boot_name FROM role_builds WHERE champion_id=? AND role=? AND source='wildriftcore.com'",(cid,role)).fetchall(),'variants':con.execute("SELECT variant_name,items_json FROM role_build_variants WHERE champion_id=? AND role=? AND source='wildriftcore.com'",(cid,role)).fetchall()},ensure_ascii=False))
          PY
