name: Test WRCA GitHub Package Updater

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".test-wrca-package-updater-trigger"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32.0"
      - name: Install current GitHub data package into disposable runtime
        shell: bash
        env:
          FLET_APP_STORAGE_DATA: ${{ runner.temp }}/wrca_runtime
          FLET_ASSETS_DIR: ${{ github.workspace }}/wild_rift/assets
        run: |
          set -euo pipefail
          cd wild_rift
          python - <<'PY'
          import json
          from pathlib import Path
          import paths
          paths.ensure_initial_data()
          import package_updater

          # Seed a deliberately interrupted download first. The real updater
          # must either resume it with HTTP Range or safely restart if GitHub's
          # CDN ignores Range; in both cases the installed result must be exact.
          import requests
          remote = package_updater._fetch_latest(requests.Session())
          identity = {
              "package_version": str(remote.get("package_version") or ""),
              "sha256": str(remote.get("sha256") or "").lower(),
              "size_bytes": int(remote["size_bytes"]),
              "download_url": str(remote["download_url"]),
          }
          package_updater.UPDATE_DIR.mkdir(parents=True, exist_ok=True)
          package_updater.PART_META_PATH.write_text(
              json.dumps(identity, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          with requests.get(remote["download_url"], stream=True, timeout=(20, 90)) as response:
              response.raise_for_status()
              with package_updater.PART_PATH.open("wb") as fh:
                  remaining = min(1024 * 1024, int(remote["size_bytes"]) // 3)
                  for chunk in response.iter_content(chunk_size=128 * 1024):
                      if not chunk or remaining <= 0:
                          break
                      piece = chunk[:remaining]
                      fh.write(piece)
                      remaining -= len(piece)
          partial_size = package_updater.PART_PATH.stat().st_size
          assert 0 < partial_size < int(remote["size_bytes"]), partial_size
          print("SEEDED_PARTIAL_BYTES:", partial_size)

          events = []
          summary = package_updater.update_all(events.append, "ru")
          print("\n".join(events))
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          manifest = json.loads(
              (paths.RUNTIME_DIR / "data" / "package_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["protocol_version"] == 1
          remote = package_updater._fetch_latest(__import__("requests").Session())
          assert manifest["package_version"] == remote["package_version"]
          counts = package_updater._database_counts(paths.RUNTIME_DIR / "data" / "wildrift.db")
          assert counts["champions"] == 142
          assert counts["build_cache_champions"] == 142
          assert counts["matchup_cache_champions"] == 142

          # Second check must not download/reinstall the same package.
          summary2 = package_updater.update_all(events.append, "ru")
          assert summary2["already_current"] is True
          assert summary2["downloaded"] is False
          print("SECOND_CHECK:", json.dumps(summary2, ensure_ascii=False))
          PY
