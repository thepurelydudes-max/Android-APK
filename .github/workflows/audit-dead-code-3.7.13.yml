name: Audit dead Python code 3.7.13

on:
  push:
    branches:
      - release-3.7.13-cleanup
    paths:
      - ".github/workflows/audit-dead-code-3.7.13.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulture 100 percent confidence
        shell: bash
        run: |
          python -m pip install "vulture==2.14"
          vulture wild_rift --min-confidence 100 || true
